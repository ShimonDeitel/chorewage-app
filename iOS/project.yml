name: Chorewage
options:
  bundleIdPrefix: com.shimondeitel.chorewage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Chorewage:
    type: application
    platform: iOS
    sources:
      - path: Chorewage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.chorewage
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Chorewage/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  ChorewageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChorewageTests
      - path: Chorewage.storekit
    dependencies:
      - target: Chorewage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.chorewage.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  ChorewageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChorewageUITests
    dependencies:
      - target: Chorewage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.chorewage.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Chorewage:
    build:
      targets:
        Chorewage: all
        ChorewageTests: [test]
        ChorewageUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Chorewage.storekit
    test:
      config: Debug
      storeKitConfiguration: Chorewage.storekit
      targets:
        - ChorewageTests
        - ChorewageUITests
    archive:
      config: Release
